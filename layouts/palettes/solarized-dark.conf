#| summary: Solarized dark; assumes a Solarized terminal palette
#
# Assumes a terminal with Solarized color palette

# solarized color palette
base03="colour8"       # background (dark)
base02="colour0"       # background highlights (dark)
base01="colour10"      # secondary text (dark) / emphasized text (light)
base00="colour11"      # primary text (light)
base0="colour12"       # primary text (dark)
base1="colour14"       # emphasized text (dark) / secondary text (light)
base2="colour7"        # background highlights (light)
base3="colour15"       # background (light)
yellow="colour3"
orange="colour9"
red="colour1"
magenta="colour5"
violet="colour13"
blue="colour4"
cyan="colour6"
green="colour2"

# status line "normal" background colors
set-option @airline-palette-outer-bg "$base00"
set-option @airline-palette-middle-bg "$base01"
set-option @airline-palette-inner-bg "$base02"

# "normal" content colors
set-option @airline-palette-secondary "$base0"
set-option @airline-palette-primary "$base1"
set-option @airline-palette-emphasized "$base2"

# highlight active elements
set-option @airline-palette-active "$yellow"

# highlight special conditions
set-option @airline-palette-special "$magenta"

# highlight alert/active conditions
set-option @airline-palette-alert "$orange"

# highlight high stress conditions
set-option @airline-palette-stress "$red"

# highlight success / completion conditions
set-option @airline-palette-ok "$green"

# tmux modes
set-option @airline-palette-zoom "$violet"
set-option @airline-palette-copy "$blue"
set-option @airline-palette-monitor "$cyan"

# vim: ft=tmux

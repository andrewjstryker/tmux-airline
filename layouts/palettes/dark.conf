#| summary: Dark 256-color palette for any 256-color terminal
#
# Uses explicit 256-color codes; works on any 256-color terminal without
# special palette configuration.

# Backgrounds — three greys stepping from medium-dark to near-black
set-option @airline-palette-outer-bg "colour238"    # #444444
set-option @airline-palette-middle-bg "colour236"   # #303030
set-option @airline-palette-inner-bg "colour234"    # #1c1c1c

# Content colors — light greys with increasing brightness
set-option @airline-palette-secondary "colour246"   # #949494
set-option @airline-palette-primary "colour250"     # #bcbcbc
set-option @airline-palette-emphasized "colour255"  # #eeeeee

# Semantic highlights
set-option @airline-palette-active "colour214"      # warm amber
set-option @airline-palette-special "colour134"     # purple
set-option @airline-palette-alert "colour208"       # orange
set-option @airline-palette-stress "colour196"      # red
set-option @airline-palette-ok "colour114"          # green (success)

# tmux modes
set-option @airline-palette-zoom "colour81"         # sky blue
set-option @airline-palette-copy "colour75"         # steel blue
set-option @airline-palette-monitor "colour109"     # muted teal

# vim: ft=tmux

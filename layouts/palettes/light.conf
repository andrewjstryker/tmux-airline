#| summary: Light 256-color palette for any 256-color terminal
#
# Uses explicit 256-color codes; works on any 256-color terminal without
# special palette configuration.

# Backgrounds — three greys stepping from medium-light to near-white
set-option @airline-palette-outer-bg "colour252"    # #d0d0d0
set-option @airline-palette-middle-bg "colour254"   # #e4e4e4
set-option @airline-palette-inner-bg "colour231"    # #ffffff

# Content colors — dark greys with decreasing brightness
set-option @airline-palette-secondary "colour245"   # #8a8a8a
set-option @airline-palette-primary "colour240"     # #585858
set-option @airline-palette-emphasized "colour235"  # #262626

# Semantic highlights
set-option @airline-palette-active "colour136"      # dark amber
set-option @airline-palette-special "colour128"     # dark purple
set-option @airline-palette-alert "colour166"       # dark orange
set-option @airline-palette-stress "colour160"      # dark red
set-option @airline-palette-ok "colour28"           # dark green (success)

# tmux modes
set-option @airline-palette-zoom "colour31"         # dark sky blue
set-option @airline-palette-copy "colour25"         # dark steel blue
set-option @airline-palette-monitor "colour66"      # dark teal

# vim: ft=tmux

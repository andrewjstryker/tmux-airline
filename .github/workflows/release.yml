name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify tag matches VERSION
        run: scripts/check-version "$GITHUB_REF_NAME"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux bats

      - name: Run tests
        run: make test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "tmux-airline $(< VERSION)"
